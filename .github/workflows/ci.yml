name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-kit:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test shared kit
        run: swift test --package-path Packages/NotchQuotaKit
      # The kit exists to be reused by the iOS app and its widget extension,
      # so a macOS-only compile is not enough to call it green.
      - name: Verify the kit still builds for iOS
        run: xcodebuild -scheme NotchQuotaKit -destination 'generic/platform=iOS' build
        working-directory: Packages/NotchQuotaKit

  test-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Apple Silicon app
        run: scripts/build-app.sh
      - name: Verify app layout and signature
        run: scripts/check-release.sh
      - name: Archive CI build (not notarized)
        run: ditto -c -k --keepParent build/NotchQuota.app build/NotchQuota-CI-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: NotchQuota-CI-arm64-not-notarized
          path: build/NotchQuota-CI-arm64.zip
          retention-days: 7
